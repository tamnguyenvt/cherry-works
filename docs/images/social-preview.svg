<text x="92" y="258" fill="#171717" font-size="78" font-weight="700" letter-spacing="-1">Cherry Works</text>
<text x="96" y="318" fill="#404040" font-size="30">Your team's way of working,</text>
<text x="96" y="358" fill="#404040" font-size="30">written once for coding agents.</text>
<rect x="96" y="408" width="440" height="58" rx="12" fill="#171717"/>
<text x="122" y="445" fill="#ffffff" font-family="Menlo, SF Mono, Consolas, monospace" font-size="22"><tspan fill="#fca5a5">$</tspan> npm install -g cherry-works</text>
<text x="96" y="520" fill="#525252" font-size="20">Markdown in, Claude Code and Codex files out</text>
</g>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
