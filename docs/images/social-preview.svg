<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
<title id="title">Cherry Works</title>
<desc id="description">Cherry Works: your team's way of working, written once for coding agents. A charter at the center, with guide, skill, playbook, agent, sensor, posture, mcp and script around it.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f5"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#dc2626"/><stop offset="1" stop-color="#b91c1c"/></radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#background)"/>
