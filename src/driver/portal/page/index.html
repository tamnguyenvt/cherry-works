<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cherry Works · Charter engine</title>
<style>
/* The mockup's shell, as it was drawn there: the header, the tabs, the sheet a
   view is rendered into, the modal and the toast. A view's own styles arrive
   with the view. */
* { box-sizing: border-box; }
:root { --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { margin: 0; padding: 0; }
body { background: #f4f4f5; color: #171717; font-family: var(--sans); font-size: 13px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
a { color: #1d4ed8; text-decoration: none; }
a:hover { color: #171717; }
[hidden] { display: none !important; }

.btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding: 10px 15px; border-radius: 10px; border: 1px solid #e4e4e7; background: #fff; color: #52525b; font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color .14s, color .14s, background .14s; }
.btn:hover:not([disabled]) { border-color: #171717; color: #171717; }
.btn.pri { border-color: #171717; background: #171717; color: #fff; font-weight: 650; }
.btn.pri:hover:not([disabled]) { background: #000; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.mono { font-family: var(--mono); }

/* shell */
.top { display: flex; align-items: center; gap: 12px; padding: 0 26px; height: 56px; background: #fff; border-bottom: 1px solid #e4e4e7; position: sticky; top: 0; z-index: 20; }
.top .brand { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
.top .repo { font-family: var(--mono); font-size: 11.5px; color: #a1a1aa; }
.top .search { flex: 1; max-width: 460px; margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 34px; border: 1px solid #e4e4e7; border-radius: 9px; background: #fafafa; color: #a1a1aa; }
.top .search:focus-within { border-color: #171717; background: #fff; color: #71717a; }
.top .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-family: inherit; font-size: 12.5px; color: #171717; }
.top .search input::placeholder { color: #a1a1aa; }
.top .btn { padding: 7px 13px; font-size: 12px; }
.split { position: relative; display: flex; }
.split .btn { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split .caret { display: flex; align-items: center; justify-content: center; width: 30px; padding: 0; border: 1px solid #e4e4e7; border-left: 0; border-radius: 0 10px 10px 0; background: #fff; color: #a1a1aa; cursor: pointer; }
.split .caret:hover { color: #171717; border-color: #171717; }
.split .menu { position: absolute; top: calc(100% + 6px); right: 0; width: 280px; background: #fff; border: 1px solid #e4e4e7; border-radius: 11px; box-shadow: 0 18px 40px -14px rgba(0,0,0,.28); padding: 5px; z-index: 40; }
.split .menu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; background: none; padding: 9px 11px; font: inherit; cursor: pointer; }
.split .menu button:hover { background: #fafafa; }
.split .menu b { display: block; font-size: 12.5px; font-weight: 650; color: #171717; }
.split .menu i { display: block; margin-top: 2px; font-style: normal; font-size: 11px; line-height: 1.5; color: #a1a1aa; }
.shell { max-width: 1120px; margin: 0 auto; padding: 22px 26px 60px; }
.flowtabs { display: flex; gap: 4px; padding: 4px; background: #e9e9ec; border-radius: 11px; margin-bottom: 18px; }
.flowtab { flex: 1; padding: 9px 12px; border: 0; border-radius: 8px; background: none; color: #71717a; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.flowtab.on { background: #fff; color: #171717; box-shadow: 0 1px 3px rgba(0,0,0,.09); }
.sheet { background: #fff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 20px 22px 6px; }

/* modal */
.mdovl { position: fixed; inset: 0; background: rgba(9,9,11,.35); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal { width: 640px; max-width: calc(100% - 48px); max-height: 80vh; background: #fff; border-radius: 15px; box-shadow: 0 34px 80px -22px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow: hidden; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid #f0f0f0; }
.modal-h .t { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
.modal-h .c { font-family: var(--mono); font-size: 11px; color: #a1a1aa; }
.modal-h .x { margin-left: auto; border: 0; background: none; color: #a1a1aa; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.modal-h .x:hover { color: #171717; }
.modal-b { overflow-y: auto; flex: 1; min-height: 0; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 18px; border-top: 1px solid #f0f0f0; }
.modal-f:empty { display: none; }

.toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(12px); background: #17181c; color: #fff; border-radius: 11px; padding: 11px 17px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast b { font-weight: 650; }
.toast span { color: #8b919c; margin-left: 8px; }

/* the repository's charter, by kind: the chips, the line saying when that kind
   comes up, and the table of what is held. The columns follow the kind, so the
   grid is declared three ways and a row says which it is. */
.sec-head2 { display: flex; align-items: baseline; gap: 9px; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
.sec-head2 span { font-size: 11.5px; font-weight: 400; color: #a1a1aa; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #e4e4e7; border-radius: 9px; background: #fff; color: #3f3f46; font-size: 11.5px; cursor: pointer; }
.chip b { font-family: var(--mono); font-size: 10px; font-weight: 400; color: #a1a1aa; }
.chip.on { border-color: #171717; background: #171717; color: #fff; font-weight: 650; }
.chip.on b { color: rgba(255,255,255,.7); }
.actnote { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
.actnote b { flex-shrink: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #a1a1aa; }
.actnote span { font-size: 12px; line-height: 1.5; color: #3f3f46; }
.panel { border: 1px solid #e4e4e7; border-radius: 14px; background: #fff; overflow: hidden; margin-bottom: 16px; }
.mem-empty { padding: 22px; text-align: center; font-size: 12.5px; color: #a1a1aa; }
.chrow { display: grid; gap: 10px; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f7f7f8; }
.chrow.g { grid-template-columns: minmax(96px, 128px) minmax(0, 1fr) 150px 108px 98px; align-items: start; }
.chrow.n { grid-template-columns: minmax(120px, 180px) minmax(0, 1fr) 130px; }
.chrow.m { grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); }
.chrow:last-child { border-bottom: 0; }
.chrow:hover { background: #fafafa; }
.chrow.chhead { padding: 9px 15px; background: #fafafa; border-bottom: 1px solid #ececef; }
.chrow.chhead:hover { background: #fafafa; }
.chrow.chhead > span { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #a1a1aa; }
.chrow .right { text-align: right; }
.chrow .cid { min-width: 0; font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: #171717; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chrow.g .cid { padding-top: 1px; }
.chrow .cbd { min-width: 0; }
.chrow .cbd .cn { display: block; font-size: 12.5px; font-weight: 600; color: #171717; }
.chrow .cbd .cp { display: block; font-family: var(--mono); font-size: 10.5px; color: #a1a1aa; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chrow .cgl { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; align-content: flex-start; min-width: 0; }
.chrow .cgl span { font-family: var(--mono); font-size: 10px; color: #3f3f46; background: #f4f4f5; border-radius: 5px; padding: 2px 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chrow.g .cgl span { font-size: 9.5px; padding: 2px 5px; }
.chrow .cgl i { font-style: normal; font-size: 10.5px; color: #c4c4c8; }
.chrow .cgl i.said { color: #b91c1c; }
</style>
<script type="module" src="./main.js"></script>
</head>
<body></body>
</html>
